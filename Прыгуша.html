<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Прыгуша</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Neucha&display=swap">
<style>
/* Layout: one centered notebook-page stage (400x640 canvas) with title above and photo tools below. */
:root {
  --green: #0f503c;
  --chalk: #f4faf6;
  --chalk-soft: #bfe0cc;
  --paper: #f4f7fb;
  --ink: #0b2a21;
  --ink-soft: #3f5a4e;
  --marker: #ffcf4a;
  --pink: #ff8fab;
  --coffee: #2fb24f;
  --coffee-dark: #1d7a35;
  --display: 'Caveat', 'Comic Sans MS', cursive;
  --body: 'Neucha', 'Comic Sans MS', cursive;
  --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--green); }
body {
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--green);
  min-height: 100vh;
}
.wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
header { display: flex; align-items: baseline; justify-content: center; gap: 14px; flex-wrap: wrap; text-align: center; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; margin: 0; text-wrap: balance; }
.legend { margin: 0; color: var(--chalk-soft); font-size: 1rem; }

.stage {
  position: relative;
  width: clamp(260px, calc((100dvh - 200px) * .625), 440px);
  max-width: 100%;
  aspect-ratio: 400 / 640;
  border: 3px solid var(--chalk);
  border-radius: 10px 14px 9px 15px;
  box-shadow: 5px 5px 0 var(--ink);
  background: var(--green);
  overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }

.overlay {
  position: absolute; inset: 0;
  display: flex; justify-content: center; align-items: flex-start;
  padding: clamp(14px, 5%, 34px) 14px 0;
}
.card {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: var(--wobble);
  box-shadow: 4px 4px 0 var(--ink);
  padding: 16px 20px 18px;
  width: 100%; max-width: 330px;
  display: grid; gap: 10px; text-align: center; justify-items: center;
}
/* Logo sits in the top half, so the start screen keeps its buttons below it and the game-over card sits low. */
#menu { padding-top: 83%; }
#over { align-items: flex-end; padding: 0 14px clamp(14px, 5%, 30px); }
.card.bare { background: none; border: none; box-shadow: none; padding: 0; width: auto; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 2.7rem; line-height: 1; margin: 0; }
.card p { margin: 0; line-height: 1.35; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; justify-self: stretch; }
.rules li { display: flex; align-items: center; gap: 10px; }
.chip { flex: none; width: 22px; height: 14px; border: 2.5px solid var(--ink); border-radius: 4px; background: var(--marker); }
.chip.cup { width: 16px; height: 20px; margin-inline: 3px; background: var(--coffee); border-radius: 3px 3px 6px 6px; }
.big { font-family: var(--display); font-weight: 700; font-size: 4rem; line-height: .9; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.btn {
  font-family: var(--body); font-size: 1.1rem; color: var(--ink);
  padding: .5em 1.1em;
  border: 2.5px solid var(--ink); border-radius: var(--wobble);
  background: var(--marker);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn.alt { background: var(--paper); }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

.tools { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.thumb { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); object-fit: cover; background: #fff; }
.hint { margin: 0; text-align: center; color: var(--chalk-soft); font-size: .95rem; max-width: 440px; line-height: 1.35; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<main class="wrap">
  <header>
    <h1>Прыгуша</h1>
    <p class="legend">+2 за платформу, +10 за кофе на каждой 20-й</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" role="img" aria-label="Игровое поле: персонаж прыгает вверх по платформам"></canvas>

    <div class="overlay" id="menu">
      <div class="card bare">
        <div class="row">
          <button class="btn" id="playBtn" type="button">Играть</button>
          <button class="btn alt photo-btn" type="button">Добавить фото</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2>Упал!</h2>
        <div class="big" id="finalScore">0</div>
        <p id="finalNote"></p>
        <div class="row">
          <button class="btn" id="againBtn" type="button">Ещё раз</button>
          <button class="btn alt photo-btn" type="button">Добавить фото</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tools">
    <input id="photo" class="sr" type="file" accept="image/*">
    <img id="thumb" class="thumb" alt="Твоё фото" hidden>
    <button class="btn alt photo-btn" id="photoMain" type="button">Добавить фото</button>
    <button class="btn alt" id="clearBtn" type="button" hidden>Убрать фото</button>
  </div>
  <p class="hint">Стрелки или A / D. На телефоне держи левую или правую часть экрана. Фото остаётся только в твоём браузере.</p>
</main>

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-25, -26); ctx.lineTo(25, -26); ctx.lineTo(19, 28); ctx.lineTo(-19, 28); ctx.closePath();
    ctx.fillStyle = COFFEE; ctx.fill(); ctx.stroke();
    // label with the logo
    ctx.beginPath();
    ctx.moveTo(-22.4, -15); ctx.lineTo(22.4, -15); ctx.lineTo(19.2, 15); ctx.lineTo(-19.2, 15); ctx.closePath();
    ctx.fillStyle = GREEN; ctx.fill();
    if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, -19, -13, 38, 26);
    // lid
    ctx.beginPath();
    ctx.moveTo(-28, -26); ctx.lineTo(-26, -36); ctx.lineTo(26, -36); ctx.lineTo(28, -26); ctx.closePath();
    ctx.fillStyle = COFFEE_D; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  function blobPath(r, seed) {
    var n = 22;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      var rr = r + (hash(seed + (i % n) * 1.7) - 0.5) * 2.2;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  function drawPlayerAt(px, py) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(player.rot);
    var sy = 1 + clamp(-player.vy / JUMP, -1, 1) * 0.1 - player.sq * 0.15;
    ctx.scale(2 - sy, sy);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = CHALK; ctx.lineWidth = 3.5;
    // legs
    ctx.beginPath();
    ctx.moveTo(-10, R - 2); ctx.lineTo(-10, BOT - 2); ctx.lineTo(-17, BOT - 2);
    ctx.moveTo(10, R - 2); ctx.lineTo(10, BOT - 2); ctx.lineTo(17, BOT - 2);
    ctx.stroke();
    // body
    blobPath(R, 7);
    if (sprite) {
      ctx.save();
      ctx.clip();
      ctx.drawImage(sprite, -R, -R, R * 2, R * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#cdb8ff'; ctx.fill();
      ctx.fillStyle = INK; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.arc(-9, -5, 3.2, 0, Math.PI * 2); ctx.arc(9, -5, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, 3, 11, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = PINK;
      ctx.beginPath(); ctx.ellipse(-16, 6, 5, 3, 0, 0, Math.PI * 2); ctx.ellipse(16, 6, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.lineWidth = 3.5; ctx.strokeStyle = CHALK;
    blobPath(R, 7);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    drawPlayerAt(player.x, player.y);
    if (player.x < R + 10) drawPlayerAt(player.x + W + R * 2, player.y);
    else if (player.x > W - R - 10) drawPlayerAt(player.x - W - R * 2, player.y);
  }

  function drawBackground() {
    ctx.fillStyle = GREEN;
    ctx.fillRect(0, 0, W, H);
    if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, LOGO_X, LOGO_Y, LOGO_W, LOGO_H);
  }

  function drawHud() {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.textBaseline = 'alphabetic';
    ctx.font = DISPLAY;
    ctx.textAlign = 'left';
    ctx.lineWidth = 6; ctx.strokeStyle = GREEN;
    var label = String(score);
    ctx.strokeText(label, 16, 44); ctx.fillStyle = CHALK; ctx.fillText(label, 16, 44);
    ctx.font = '700 22px Caveat, "Comic Sans MS", cursive';
    ctx.textAlign = 'right';
    var b = 'рекорд ' + Math.max(best, score);
    ctx.lineWidth = 5;
    ctx.strokeText(b, W - 14, 34); ctx.fillStyle = SOFT; ctx.fillText(b, W - 14, 34);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    ctx.save();
    ctx.translate(0, -camY);
    var i, p;
    for (i = 0; i < plats.length; i++) {
      p = plats[i];
      drawPlatform(p);
      if (p.coffee && !p.coffee.taken) drawCoffee(p.x + p.w / 2, p.y - 30 + Math.sin(time * 3 + p.index) * 3);
    }
    for (i = 0; i < parts.length; i++) {
      var q = parts[i];
      ctx.globalAlpha = 1 - q.t / q.life;
      ctx.fillStyle = COFFEE; ctx.strokeStyle = CHALK; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawPlayer();
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    for (i = 0; i < popups.length; i++) {
      var f = popups[i];
      ctx.globalAlpha = 1 - f.t / 0.9;
      ctx.font = '700 ' + f.size + 'px Caveat, "Comic Sans MS", cursive';
      var fy = f.y - f.t * 50;
      ctx.lineWidth = 6; ctx.strokeStyle = GREEN; ctx.strokeText(f.text, f.x, fy);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, fy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (state !== 'menu') drawHud();
  }

  /* ---------- flow ---------- */
  function startGame() {
    if (state === 'over') reset();
    bestAtStart = best;
    state = 'play';
    player.vy = -JUMP;
    menuEl.hidden = true;
    overEl.hidden = true;
  }

  function gameOver() {
    state = 'over';
    var record = score > bestAtStart;
    if (score > best) best = score;
    if (record) lsSet('pryguscha-best', String(best));
    finalScoreEl.textContent = String(score);
    finalNoteEl.textContent = record ? 'Новый рекорд!' : 'Рекорд: ' + best;
    overEl.hidden = false;
  }

  /* ---------- photo ---------- */
  function makeSprite(img) {
    var c = document.createElement('canvas');
    c.width = c.height = 192;
    var side = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, (iw - side) / 2, (ih - side) / 2, side, side, 0, 0, 192, 192);
    sprite = c;
    try { spriteURL = c.toDataURL('image/jpeg', 0.82); } catch (e) { spriteURL = ''; }
    updatePhotoUi();
  }

  function updatePhotoUi() {
    var has = !!sprite;
    thumbEl.hidden = !has || !spriteURL;
    if (has && spriteURL) thumbEl.src = spriteURL;
    clearBtn.hidden = !has;
    var btns = document.querySelectorAll('.photo-btn');
    for (var i = 0; i < btns.length; i++) btns[i].textContent = has ? 'Другое фото' : 'Добавить фото';
  }

  photoInput.addEventListener('change', function () {
    var file = photoInput.files && photoInput.files[0];
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () { makeSprite(img); if (spriteURL) lsSet('pryguscha-photo', spriteURL); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
    photoInput.value = '';
  });

  clearBtn.addEventListener('click', function () {
    sprite = null; spriteURL = ''; lsDel('pryguscha-photo');
    updatePhotoUi();
  });

  Array.prototype.forEach.call(document.querySelectorAll('.photo-btn'), function (b) {
    b.addEventListener('click', function () { photoInput.click(); });
  });
  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  var saved = lsGet('pryguscha-photo');
  if (saved) {
    var si = new Image();
    si.onload = function () { makeSprite(si); };
    si.src = saved;
  }

  /* ---------- input ---------- */
  window.addEventListener('keydown', function (e) {
    var k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'KeyD') { keys.right = true; e.preventDefault(); }
    else if ((k === 'Space' || k === 'Enter') && state !== 'play') {
      var t = e.target && e.target.tagName;
      if (t !== 'BUTTON' && t !== 'INPUT') { e.preventDefault(); startGame(); }
    }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA') keys.left = false;
    else if (k === 'ArrowRight' || k === 'KeyD') keys.right = false;
  });
  window.addEventListener('blur', function () { keys.left = keys.right = false; pointerDir = 0; });

  function setPointer(e) {
    var r = canvas.getBoundingClientRect();
    pointerDir = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
  }
  canvas.addEventListener('pointerdown', function (e) {
    setPointer(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') { if (pointerDir !== 0) setPointer(e); } });
  function endPointer() { pointerDir = 0; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  /* ---------- loop ---------- */
  reset();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state === 'over') fx(dt); else update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
